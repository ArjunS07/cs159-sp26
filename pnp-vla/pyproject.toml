[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pnp"
version = "0.1.0"
description = "Predict-and-Perturb / Predict-Correct-Perturb inference for pi0.5 on LIBERO / LIBERO-PRO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "imageio",
    "imageio-ffmpeg",
    "tqdm",
    "supabase>=2.0",
    "pandas",
    "pyarrow",
    "wandb",
]

[project.optional-dependencies]
# Heavy sim/model deps — installed in Colab (GPU). Kept optional so the package
# imports (config, store, analysis helpers) work locally without a GPU stack.
sim = [
    "transformers==5.5.4",
    "mujoco>=3.1.6,<4",
    "libero==0.1.1",
    "lerobot[pi0] @ git+https://github.com/huggingface/lerobot.git@01dcb4c29222bc9f2388cebf87f0e79965a9508b",
]
analysis = [
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
]

[tool.setuptools.packages.find]
include = ["pnp*"]
